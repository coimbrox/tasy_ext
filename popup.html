<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasy DevTools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <img src="icon.png" alt="Logo" class="logo" />
        <h1>Tasy DevTools</h1>
      </div>

      <div class="section-title">Metadados TASY</div>

      <div class="field metadata-grid">
        <label class="checkbox-label">
          <input id="showFieldDetails" type="checkbox" />
          Detalhes de campo
        </label>
        <label class="checkbox-label">
          <input id="showGridDetails" type="checkbox" />
          Detalhes de grid
        </label>
        <label class="checkbox-label">
          <input id="showPanelDetails" type="checkbox" />
          Detalhes de painel
        </label>
        <label class="checkbox-label">
          <input id="showRecentFeatures" type="checkbox" />
          Recentes (tela inicial)
        </label>
        <label class="checkbox-label">
          <input id="showUserLocale" type="checkbox" />
          Idioma do usuário no rodapé
        </label>
        <label class="checkbox-label">
          <input id="inspectMode" type="checkbox" />
          Modo inspeção
        </label>
        <label class="checkbox-label">
          <input id="showReportLayout" type="checkbox" />
          Layout visual (relatórios)
        </label>
      </div>

      <div class="actions">
        <button id="clearRecentFeaturesBtn" type="button">Limpar recentes</button>
        <button id="reloadStylesheetsBtn" type="button">Recarregar estilos</button>
      </div>

      <div class="section-title">Trace de processo</div>

      <div class="field">
        <p class="trace-hint">Ative antes de executar o processo que quer documentar (ex.: criar um usuário). Ao desativar, o resumo das telas e requisições é copiado automaticamente.</p>
        <div class="actions">
          <button id="toggleTraceBtn" type="button" class="primary">Ativar trace</button>
        </div>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
