<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasy DevTools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <img src="icon.png" alt="Logo" class="logo" />
        <h1>Tasy DevTools</h1>
      </div>

      <div class="field">
        <label for="domainPreset">Domínio configurado</label>
        <select id="domainPreset">
          <option value="auto">Usar aba ativa</option>
          <option value="custom">Outro domínio...</option>
        </select>
      </div>

      <div class="field">
        <label for="customDomain">Domínio personalizado</label>
        <input id="customDomain" type="text" placeholder="ex: tasy.suaempresa.com.br" disabled />
      </div>

      <div class="actions">
        <button id="saveDomainBtn" type="button">Salvar domínio</button>
      </div>

      <div class="field">
        <label>Domínio atual</label>
        <div id="domain" class="value">-</div>
      </div>

      <div class="field">
        <label>Valor atual (`TASYAPPSERVER_TASY`)</label>
        <textarea id="currentValue" rows="3" readonly placeholder="Não lido ainda"></textarea>
      </div>

      <div class="field">
        <label for="newValue">Novo valor</label>
        <textarea id="newValue" rows="3" placeholder="Digite o novo valor"></textarea>
      </div>

      <div class="actions">
        <button id="refreshBtn" type="button">Ler cookie</button>
        <button id="saveBtn" type="button" class="primary">Salvar</button>
      </div>

      <div class="field">
        <label>Tracer de performance</label>
        <div class="actions actions-trace">
          <button id="copyTraceBtn" type="button">Copiar log</button>
          <button id="clearTraceBtn" type="button">Limpar log</button>
        </div>
      </div>

      <div class="section-title">Metadados TASY</div>

      <div class="field metadata-grid">
        <label class="checkbox-label">
          <input id="showFieldDetails" type="checkbox" />
          Detalhes de campo
        </label>
        <label class="checkbox-label">
          <input id="showGridDetails" type="checkbox" />
          Detalhes de grid
        </label>
        <label class="checkbox-label">
          <input id="showPanelDetails" type="checkbox" />
          Detalhes de painel
        </label>
        <label class="checkbox-label">
          <input id="showRecentFeatures" type="checkbox" />
          Recentes (tela inicial)
        </label>
        <label class="checkbox-label">
          <input id="showUserLocale" type="checkbox" />
          Idioma do usuário no rodapé
        </label>
        <label class="checkbox-label">
          <input id="inspectMode" type="checkbox" />
          Modo inspeção
        </label>
      </div>

      <div class="actions">
        <button id="clearRecentFeaturesBtn" type="button">Limpar recentes</button>
        <button id="reloadStylesheetsBtn" type="button">Recarregar estilos</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
